<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Centro Alertia 724 · Alertia Biker</title>
<meta name="theme-color" content="#0D1B2A">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="assets/estilo.css">
<style>
body{background:#0A1622;color:#fff;min-height:100vh}
.acceso{max-width:380px;margin:12vh auto;padding:0 18px;text-align:center}
.acceso .panel{background:var(--navy);border-color:var(--navy3);color:#fff}
.acceso input{background:#0A1622;border-color:var(--navy3);color:#fff;text-align:center;font-size:22px;letter-spacing:.3em}
.tab{display:none;padding:18px max(18px,env(safe-area-inset-left)) 24px;max-width:1500px;margin:0 auto}
.tab.activo{display:block}
.enc{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.enc h1{font-size:26px;margin:0}
.vivo{display:inline-flex;align-items:center;gap:8px;color:var(--lima);font-weight:700;font-size:14px;border:1px solid #3B5A2A;padding:4px 12px;border-radius:999px}
.vivo i{width:9px;height:9px;border-radius:50%;background:var(--lima);animation:lat 1.4s infinite}
@keyframes lat{50%{opacity:.25}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--navy);border:1px solid var(--navy3);border-radius:14px;padding:14px 16px}
.kpi small{color:#9FB0C2;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.kpi b{display:block;font:800 34px var(--f-tit);color:var(--lima);font-variant-numeric:tabular-nums}
.cuerpo{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
#mapa{height:min(68vh,620px);border-radius:16px;border:1px solid var(--navy3)}
.lista{background:var(--navy);border:1px solid var(--navy3);border-radius:16px;padding:8px;max-height:min(68vh,620px);overflow:auto}
.ev{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:12px;border-bottom:1px solid var(--navy3)}
.ev:last-child{border-bottom:0}
.ev.nuevo{animation:flash 2.5s ease-out}
@keyframes flash{0%{background:rgba(170,255,0,.35)}100%{background:transparent}}
.badge{font:800 12px var(--f-txt);padding:5px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.escaneo{background:var(--rojo);color:#fff}.whatsapp{background:var(--lima);color:var(--navy)}.paramedico{background:var(--azul);color:#fff}
.llamada_familia,.llamada_911{background:#F2A900;color:var(--navy)}
.ev b{display:block}
.ev span.det{color:#9FB0C2;font-size:14px}
.ev time{color:#9FB0C2;font-size:14px;font-variant-numeric:tabular-nums}
.vacio{color:#9FB0C2;text-align:center;padding:40px}
@media (max-width:900px){.cuerpo{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
.leaflet-container{background:#0A1622}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.6)}
</style>
</head>
<body>
<section class="acceso" id="acceso">
  <a class="logo" href="./" id="logo" style="justify-content:center;margin-bottom:20px">ALERTIA <b>BIKER</b></a>
  <form class="panel" id="facceso">
    <h1 style="font-size:24px">Centro de monitoreo Alertia 724</h1>
    <p style="color:#9FB0C2">Acceso para el personal del centro.</p>
    <input id="codigo" type="password" inputmode="numeric" placeholder="Código" aria-label="Código del centro" autocomplete="off">
    <p class="error" id="err"></p>
    <button class="btn btn-lima" style="width:100%">Entrar</button>
  </form>
</section>

<section class="tab" id="tablero">
  <div class="enc">
    <a class="logo" href="./" id="logo2">ALERTIA <b>BIKER</b></a>
    <h1>Centro de monitoreo</h1>
    <span class="vivo"><i></i>EN VIVO</span>
  </div>
  <div class="kpis">
    <div class="kpi"><small>Motociclistas protegidos</small><b id="k1">0</b></div>
    <div class="kpi"><small>Escaneos 24 h</small><b id="k2">0</b></div>
    <div class="kpi"><small>Avisos a familias 24 h</small><b id="k3">0</b></div>
    <div class="kpi"><small>Accesos de personal 24 h</small><b id="k4">0</b></div>
  </div>
  <div class="cuerpo">
    <div id="mapa" role="region" aria-label="Mapa de escaneos"></div>
    <div class="lista" id="lista"><p class="vacio">Esperando escaneos…</p></div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="assets/app.js"></script>
<script>
document.getElementById('logo').insertAdjacentHTML('afterbegin', LOGO);
document.getElementById('logo2').insertAdjacentHTML('afterbegin', LOGO);
const NOMBRES = { escaneo: 'Casco escaneado', whatsapp: 'Familia avisada', paramedico: 'Personal consultó ficha', llamada_familia: 'Llamada a familia', llamada_911: 'Llamada al 911' };
let codigo = '', mapa, capa, vistos = new Set(), primera = true;

document.getElementById('facceso').addEventListener('submit', async e => {
  e.preventDefault();
  codigo = document.getElementById('codigo').value.trim();
  try { await rpc('biker_tablero', { p_codigo: codigo }); }
  catch (er) { document.getElementById('err').textContent = 'Código incorrecto.'; return; }
  document.getElementById('acceso').style.display = 'none';
  document.getElementById('tablero').classList.add('activo');
  mapa = L.map('mapa', { zoomControl: true }).setView([23.2494, -106.4111], 12); // Mazatlán
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(mapa);
  capa = L.layerGroup().addTo(mapa);
  actualizar();
  setInterval(actualizar, 3000);
});

function hora(iso) { return new Date(iso).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }

async function actualizar() {
  let d;
  try { d = await rpc('biker_tablero', { p_codigo: codigo }); } catch (e) { return; }
  const ev = d.eventos || [];
  document.getElementById('k1').textContent = d.registrados;
  document.getElementById('k2').textContent = d.escaneos_hoy;
  document.getElementById('k3').textContent = d.avisos_hoy;
  document.getElementById('k4').textContent = d.paramedicos_hoy;
  const lista = document.getElementById('lista');
  if (!ev.length) return;
  lista.innerHTML = ev.map(x => `<div class="ev ${!primera && !vistos.has(x.id) ? 'nuevo' : ''}">
      <span class="badge ${x.tipo}">${NOMBRES[x.tipo] || x.tipo}</span>
      <div><b>${esc(x.nombre)}</b><span class="det">${esc(x.moto || '')} · Contacto: ${esc(x.contacto1_nombre)}${x.lat ? ' · 📍 ubicación' : ''}</span></div>
      <time>${hora(x.created_at)}</time></div>`).join('');
  capa.clearLayers();
  let nuevoPunto = null;
  ev.filter(x => x.lat).forEach(x => {
    const color = x.tipo === 'escaneo' ? '#E5383B' : '#AAFF00';
    const m = L.circleMarker([x.lat, x.lng], { radius: 10, color, fillColor: color, fillOpacity: .8, weight: 2 })
      .bindPopup(`<b>${esc(x.nombre)}</b><br>${NOMBRES[x.tipo]} · ${hora(x.created_at)}`).addTo(capa);
    if (!primera && !vistos.has(x.id) && !nuevoPunto) nuevoPunto = [x.lat, x.lng];
  });
  if (nuevoPunto) mapa.flyTo(nuevoPunto, 15);
  else if (primera) { const p = ev.find(x => x.lat); if (p) mapa.setView([p.lat, p.lng], 13); }
  ev.forEach(x => vistos.add(x.id));
  primera = false;
}
</script>
</body>
</html>
