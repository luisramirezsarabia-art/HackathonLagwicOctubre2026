<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chip · Alertia Biker</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/assets/estilo.css">
<style>
body{background:var(--gris);display:grid;place-items:center;min-height:100vh;padding:20px}
.chip{width:320px;background:var(--navy);border:8px solid var(--lima);border-radius:30px;padding:24px 20px 18px;color:#fff;text-align:center}
.t1{font:800 36px/1 var(--f-tit)}.t2{font:800 46px/1 var(--f-tit);color:var(--lima);margin-bottom:8px}
.qr{background:#fff;padding:12px;border-radius:12px;display:inline-block;margin:8px 0}
.qr img,.qr canvas{display:block;width:220px;height:220px}
.esc{font:800 16px var(--f-tit);color:var(--lima);margin-top:8px}.en{font-size:13px;color:#C9D3DE}
.pies{display:flex;gap:8px;justify-content:center;margin-top:12px}.pies span{border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px}
.codigo{font:700 12px monospace;color:#8EA0B4;margin-top:10px;letter-spacing:.15em}
.acc{margin-top:18px;text-align:center}
@media print{.acc{display:none}body{background:#fff}.chip{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div>
  <div class="chip">
    <div class="t1">ALERTIA</div><div class="t2">BIKER</div>
    <div class="qr" id="qr"></div>
    <div class="esc">EN EMERGENCIA, ESCANÉAME</div>
    <div class="en">IN EMERGENCY, SCAN ME</div>
    <div class="pies"><span style="background:#E5383B">Llama al 911</span><span style="background:var(--lima);color:var(--navy)">Alertia 724</span></div>
    <div class="codigo" id="codigo"></div>
  </div>
  <div class="acc"><button class="btn btn-navy" onclick="window.print()">Imprimir chip</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const id = (new URLSearchParams(location.search).get('id') || 'DEMO2027').toUpperCase().replace(/[^A-Z0-9]/g, '');
new QRCode(document.getElementById('qr'), { text: location.origin + '/e/' + id, width: 440, height: 440, colorDark: '#0D1B2A', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H });
document.getElementById('codigo').textContent = 'alertia-biker.vercel.app';
</script>
</body>
</html>
